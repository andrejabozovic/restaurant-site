name: kontra-bar

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "${WEB_PORT:-3000}"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "${WEB_PORT:-3000}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${WEB_PORT:-3000} >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
